version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tatoeba_db
    restart: always
    environment:
      POSTGRES_USER: tatoeba_user
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: tatoeba_db
    ports:
      - "15432:5432" # Host: 15432, Container: 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
    container_name: tatoeba_backend
    restart: always
    env_file:
      - .env
      - .env.local
    ports:
      - "18000:18000"

  frontend:
    build:
      context: ./frontend
    container_name: tatoeba_frontend
    restart: always
    env_file:
      - .env
      - .env.local
    ports:
      - "15173:15173"
    volumes:
      - ./frontend:/app           
      - /app/node_modules         
    depends_on:
      - backend

volumes:
  postgres_data: